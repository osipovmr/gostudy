version: "3.9"

services:
  go-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - gostudy
    environment:
      HTTP_ADDR: :8080
      DB_URL: postgres://postgres:postgres@postgres:5432/gostudy?sslmode=disable
      READ_TIMEOUT: 3s
      WRITE_TIMEOUT: 3s
      IDLE_TIMEOUT: 10s
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REGISTRATION_TOPIC: registration_topic
  postgres:
    image: postgres:17
    container_name: gostudy-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gostudy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gostudy
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      KAFKA_ALLOW_AUTO_CREATE_TOPICS: 'true'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092, CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_KRAFT_CLUSTER_ID: dh-cluster
      KAFKA_CREATE_TOPICS: '__consumer_offsets'
    depends_on:
      - go-backend
    networks:
      - gostudy
  ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - '8081:8080'
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CLUSTERS_0_NAME: go-osipov
    depends_on:
      - go-backend
    networks:
      - gostudy

volumes:
  postgres_data:
networks:
  gostudy:
    driver: bridge